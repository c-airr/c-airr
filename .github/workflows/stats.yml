name: stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats card
        env:
          # STATS_TOKEN (PAT) liczy tez prywatne repo; bez niego tylko publiczne dane
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "Update stats card"
          git push
